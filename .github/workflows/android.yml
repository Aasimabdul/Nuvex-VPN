name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build split debug APKs
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle --no-daemon :app:assembleDebug
      - name: Report APK sizes and checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "No APKs were produced"
            exit 1
          fi
          mkdir -p release-artifacts
          for apk in "${apks[@]}"; do
            size=$(stat -c%s "$apk")
            mib=$(awk -v n="$size" 'BEGIN { printf "%.2f", n/1048576 }')
            echo "$apk: $mib MiB ($size bytes)"
            cp "$apk" release-artifacts/
          done
          (cd release-artifacts && sha256sum *.apk > SHA256SUMS.txt)
          echo "5 MiB target is reported per ABI APK; any oversize result needs further optimization."
      - name: Upload development APKs
        uses: actions/upload-artifact@v4
        with:
          name: nuvex-vpn-android-debug-apks
          path: release-artifacts/*
          if-no-files-found: error
